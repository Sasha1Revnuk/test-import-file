server {
    listen 443 ssl;
    index index.php index.html;
    root /var/www/public;
    client_max_body_size 64M;
    # how to generate ssl for localhost
    # https://letsencrypt.org/uk/docs/certificates-for-localhost/
    ssl_certificate      /etc/nginx/cert/localhost.crt;
    ssl_certificate_key  /etc/nginx/cert/localhost.key;

    gzip on;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/x-javascript text/xml application/xml application/xml+rss text/javascript;

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
        gzip_static on;
    }

    error_log  /var/www/storage/logs/nginx/error_ssl.log;
    #access_log /var/log/nginx/access_ssl.log;
    access_log off;
}
